<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age-Well KOBE 2026 クイズ</title>
<style>
  :root {
    --bg: #fdf6f1;
    --card-bg: #ffffff;
    --text: #3a2a20;
    --text-muted: #8a6f60;
    --accent: #ef5a35;
    --accent-2: #ff8a5c;
    --accent-soft: #ffe4d6;
    --border: #f0d9cd;
    --correct: #2f9e5c;
    --correct-bg: #e6f7ee;
    --incorrect: #d64545;
    --incorrect-bg: #fdeaea;
    --shadow: 0 10px 30px rgba(239, 90, 53, 0.12);
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --bg: #241a15;
      --card-bg: #2f231c;
      --text: #f6ece5;
      --text-muted: #cbb2a3;
      --accent: #ff7a52;
      --accent-2: #ffa374;
      --accent-soft: #4a2f22;
      --border: #4a362b;
      --correct: #6fd39a;
      --correct-bg: #1f3a2a;
      --incorrect: #ff8686;
      --incorrect-bg: #402323;
      --shadow: 0 10px 30px rgba(0,0,0,0.4);
    }
  }
  :root[data-theme="dark"] {
    --bg: #241a15;
    --card-bg: #2f231c;
    --text: #f6ece5;
    --text-muted: #cbb2a3;
    --accent: #ff7a52;
    --accent-2: #ffa374;
    --accent-soft: #4a2f22;
    --border: #4a362b;
    --correct: #6fd39a;
    --correct-bg: #1f3a2a;
    --incorrect: #ff8686;
    --incorrect-bg: #402323;
    --shadow: 0 10px 30px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }
  .wrap { width: 100%; max-width: 640px; }

  header {
    text-align: center;
    margin-bottom: 20px;
  }
  .badge {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--accent);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.06em;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  h1 {
    font-size: clamp(22px, 5vw, 30px);
    margin: 0 0 6px;
    line-height: 1.3;
  }
  h1 span { color: var(--accent); }
  .sub {
    color: var(--text-muted);
    font-size: 14px;
    margin: 0;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 24px 20px 28px;
    border: 1px solid var(--border);
  }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 8px;
    background: var(--accent-soft);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    border-radius: 999px;
    transition: width 0.3s ease;
    width: 0%;
  }

  .question {
    font-size: 17px;
    font-weight: 700;
    line-height: 1.6;
    margin: 0 0 18px;
  }

  .options { display: flex; flex-direction: column; gap: 10px; }
  .option {
    text-align: left;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, transform 0.1s ease;
  }
  .option:hover:not(:disabled) {
    border-color: var(--accent-2);
    transform: translateY(-1px);
  }
  .option:disabled { cursor: default; }
  .option.correct {
    border-color: var(--correct);
    background: var(--correct-bg);
    color: var(--correct);
    font-weight: 700;
  }
  .option.incorrect {
    border-color: var(--incorrect);
    background: var(--incorrect-bg);
    color: var(--incorrect);
    font-weight: 700;
  }

  .feedback {
    margin-top: 16px;
    padding: 12px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
  }
  .feedback.show { display: block; }
  .feedback.ok { background: var(--correct-bg); color: var(--correct); }
  .feedback.ng { background: var(--incorrect-bg); color: var(--incorrect); }

  .next-btn {
    margin-top: 18px;
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: none;
  }
  .next-btn.show { display: block; }
  .next-btn:active { transform: scale(0.98); }

  .result {
    text-align: center;
    display: none;
  }
  .result.show { display: block; }
  .result-score {
    font-size: 44px;
    font-weight: 800;
    color: var(--accent);
    margin: 6px 0;
  }
  .result-msg {
    font-size: 15px;
    color: var(--text-muted);
    margin-bottom: 20px;
    line-height: 1.7;
  }
  .retry-btn {
    padding: 12px 28px;
    border: 1.5px solid var(--accent);
    border-radius: 999px;
    background: transparent;
    color: var(--accent);
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
  }

  footer {
    text-align: center;
    color: var(--text-muted);
    font-size: 12px;
    margin-top: 22px;
  }

  /* イントロ画面 */
  .intro { display: block; }
  .intro.hide { display: none; }
  .name-input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 15px;
    margin: 6px 0 18px;
  }
  .start-btn {
    width: 100%;
    padding: 13px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    color: white;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .intro-label { font-size: 13px; color: var(--text-muted); margin: 0 0 4px; }

  /* 管理者リンク */
  .admin-link {
    display: block;
    text-align: center;
    margin-top: 14px;
    font-size: 12px;
    color: var(--text-muted);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    width: 100%;
  }

  /* 管理者モーダル */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    align-items: center;
    justify-content: center;
    padding: 16px;
    z-index: 50;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: var(--card-bg);
    border-radius: 18px;
    padding: 22px 20px;
    width: 100%;
    max-width: 480px;
    max-height: 80vh;
    overflow-y: auto;
    border: 1px solid var(--border);
  }
  .modal-box h2 { font-size: 16px; margin: 0 0 14px; }
  .modal-row { display: flex; gap: 8px; margin-bottom: 10px; }
  .modal-row input {
    flex: 1;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  .modal-row button {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    background: var(--accent);
    color: white;
    font-size: 14px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
  }
  .modal-close {
    display: block;
    margin: 14px auto 0;
    background: none;
    border: none;
    color: var(--text-muted);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
  }
  .result-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
    margin-top: 8px;
  }
  .result-table th, .result-table td {
    text-align: left;
    padding: 7px 6px;
    border-bottom: 1px solid var(--border);
  }
  .result-table th { color: var(--text-muted); font-weight: 600; }
  .modal-msg { font-size: 13px; color: var(--text-muted); margin-top: 8px; }
  .modal-msg.error { color: var(--incorrect); }
  .modal-summary { font-size: 13px; color: var(--text-muted); margin: 4px 0 10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="badge">2026.9.19 SAT - 9.20 SUN</span>
    <h1>Age-Well <span>KOBE</span> 2026<br>来場者クイズ全50問</h1>
    <p class="sub">会場のパンフレット・うちわを見ればぜんぶわかる！挑戦してみてね</p>
  </header>

  <div class="card">
    <div class="intro" id="introArea">
      <p class="intro-label">お名前・ニックネーム（回答一覧に表示されます／空欄でも参加できます）</p>
      <input type="text" class="name-input" id="nameInput" placeholder="例：やまだ" maxlength="20">
      <button class="start-btn" id="startBtn">クイズをはじめる</button>
    </div>

    <div id="quizArea" style="display:none;">
      <div class="progress-row">
        <span id="qNum">第1問 / 50</span>
        <span id="qScore">正解 0</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <p class="question" id="questionText"></p>
      <div class="options" id="optionsArea"></div>
      <div class="feedback" id="feedback"></div>
      <button class="next-btn" id="nextBtn">次の問題へ</button>
    </div>

    <div class="result" id="resultArea">
      <p class="sub">結果発表</p>
      <div class="result-score" id="finalScore">0 / 50</div>
      <p class="result-msg" id="finalMsg"></p>
      <button class="retry-btn" id="retryBtn">もう一度挑戦する</button>
    </div>

    <button class="admin-link" id="adminLink">▶ 運営者用：みんなの回答を見る</button>
  </div>

  <footer>主催：Age-Well Festival実行委員会（株式会社AgeWellJapan、神戸新聞社）</footer>
</div>

<div class="modal-overlay" id="adminModal">
  <div class="modal-box">
    <h2>運営者用：回答一覧</h2>
    <div class="modal-row">
      <input type="password" id="adminPassword" placeholder="パスワード">
      <button id="adminSubmit">表示</button>
    </div>
    <p class="modal-msg" id="adminMsg"></p>
    <div id="adminResultWrap" style="display:none;">
      <p class="modal-summary" id="adminSummary"></p>
      <table class="result-table">
        <thead><tr><th>日時</th><th>お名前</th><th>スコア</th></tr></thead>
        <tbody id="adminTableBody"></tbody>
      </table>
    </div>
    <button class="modal-close" id="adminClose">閉じる</button>
  </div>
</div>

<script>
const questions = [
  // ── イベント基本情報 ──

  { q: "ブースエリアの場所は？", opts: ["神戸三宮センター街一丁目","元町商店街","メリケンパーク","ハーバーランド"], a: 0 },
  { q: "ステージエリアの場所は？", opts: ["三宮駅前広場","神戸阪急 本館・新館間","大丸神戸店前","神戸市役所前"], a: 1 },
  { q: "「Age-Well」の意味として正しいのは？", opts: ["健康食品のブランド名","挑戦と発見を通じてポジティブに年を重ねること","高齢者向け保険商品","神戸の新しい観光地の名前"], a: 1 },
  { q: "このイベントのキャッチコピーは？", opts: ["人生100年時代のお祭り！","未来を創る神戸の夏","みんなの健康フェス","神戸から世界へ"], a: 0 },

  // ── スタンプラリー ──
  { q: "スタンプラリーの対象ブースは何番から何番まで？", opts: ["1番〜11番","3番〜11番","1番〜9番","2番〜10番"], a: 1 },
  { q: "スタンプラリーで「花束」がもらえるのはどの組み合わせ？", opts: ["○を3個","○を4個＋○を3個","○を6個","○を4個＋○を6個"], a: 1 },

  // ── ブース番号 ──

  { q: "ブース番号5は何のブース？", opts: ["阪急電鉄","株式会社AgeWellJapan","神戸新聞社","神戸製鋼所"], a: 1 },
  { q: "ブース番号6は何のブース？", opts: ["株式会社神戸新聞社","永田良介商店","エイベックス・アライアンス&パートナーズ","ソフトバンク"], a: 0 },
  { q: "ブース番号7「コベルコ神戸スティーラーズ」を運営しているのは？", opts: ["神戸新聞社","株式会社神戸製鋼所","阪急電鉄","AgeWellJapan"], a: 1 },

  { q: "ブース番号10「永田良介商店」が手がけるものは？", opts: ["家具","洋菓子","生花","保険"], a: 0 },

  { q: "9月20日11:30からの「チアダンスパフォーマンス」を行うのは？", opts: ["studio ZONE★DIVA","CHEER FAMILY","FIDA JAPAN","チャンミカ"], a: 0 },
  { q: "9月20日13:00からの「サンバチームステージショー」を行うのは？", opts: ["G.R.E.S. Acadêmicos do Feijão Preto","パイナップルアロハフラ","ミカディスコ","CHEER FAMILY"], a: 0 },
  { q: "9月20日14:00からの「これぞAge-Well！ダンスで健康に！！」を行うのは？", opts: ["FIDA JAPAN／ダンス健康クラブ","ミカディスコ","チャンミカ","神戸楠公連"], a: 0 },
  { q: "9月20日14:15からの「昭和＆平成の名曲で盛り上がろう！」を担当するのは？", opts: ["チャンミカ","ミカディスコ","CHEER FAMILY","パイナップルアロハフラ"], a: 0 },
  { q: "9月20日のステージ最後（トリ）を飾るのは？", opts: ["ミカディスコ","バブリーチアーズ","神戸楠公連","CHEER FAMILY"], a: 0 },

  // ── その他 ──
  { q: "パンフレット記載のGOLDスポンサーは阪急のほかにどれ？", opts: ["Metz Kobe Fam.","SoftBank","FIDA JAPAN","ユタコロジー株式会社"], a: 0 }
];

// ここにGoogle Apps ScriptのウェブアプリURLを貼り付けてください
// 例: https://script.google.com/macros/s/AKfycb.../exec
const WEBAPP_URL = "https://script.google.com/macros/s/AKfycbxbqlkCpPxAQUk_0elVY6qoZyCc8JjrNKxI-0CeQAwSVJYdkf9cRC9X879SKdG2S5_u/exec";

let current = 0;
let score = 0;
let answered = false;
let playerName = "";

const introArea = document.getElementById('introArea');
const nameInput = document.getElementById('nameInput');
const startBtn = document.getElementById('startBtn');
const qNum = document.getElementById('qNum');
const qScore = document.getElementById('qScore');
const progressFill = document.getElementById('progressFill');
const questionText = document.getElementById('questionText');
const optionsArea = document.getElementById('optionsArea');
const feedback = document.getElementById('feedback');
const nextBtn = document.getElementById('nextBtn');
const quizArea = document.getElementById('quizArea');
const resultArea = document.getElementById('resultArea');
const finalScore = document.getElementById('finalScore');
const finalMsg = document.getElementById('finalMsg');
const retryBtn = document.getElementById('retryBtn');
const adminLink = document.getElementById('adminLink');
const adminModal = document.getElementById('adminModal');
const adminPassword = document.getElementById('adminPassword');
const adminSubmit = document.getElementById('adminSubmit');
const adminClose = document.getElementById('adminClose');
const adminMsg = document.getElementById('adminMsg');
const adminResultWrap = document.getElementById('adminResultWrap');
const adminSummary = document.getElementById('adminSummary');
const adminTableBody = document.getElementById('adminTableBody');

startBtn.addEventListener('click', () => {
  playerName = nameInput.value.trim();
  introArea.classList.add('hide');
  quizArea.style.display = 'block';
  renderQuestion();
});

function renderQuestion() {
  answered = false;
  const item = questions[current];
  qNum.textContent = `第${current + 1}問 / ${questions.length}`;
  qScore.textContent = `正解 ${score}`;
  progressFill.style.width = `${(current / questions.length) * 100}%`;
  questionText.textContent = item.q;
  optionsArea.innerHTML = '';
  feedback.className = 'feedback';
  feedback.textContent = '';
  nextBtn.classList.remove('show');

  item.opts.forEach((opt, idx) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = opt;
    btn.addEventListener('click', () => selectAnswer(idx));
    optionsArea.appendChild(btn);
  });
}

function selectAnswer(idx) {
  if (answered) return;
  answered = true;
  const item = questions[current];
  const buttons = optionsArea.querySelectorAll('.option');
  buttons.forEach((b) => (b.disabled = true));

  if (idx === item.a) {
    score++;
    buttons[idx].classList.add('correct');
    feedback.className = 'feedback ok show';
    feedback.textContent = '正解です！';
  } else {
    buttons[idx].classList.add('incorrect');
    buttons[item.a].classList.add('correct');
    feedback.className = 'feedback ng show';
    feedback.textContent = '残念、不正解です。正解は緑色の選択肢です。';
  }
  qScore.textContent = `正解 ${score}`;
  nextBtn.classList.add('show');
}

nextBtn.addEventListener('click', () => {
  current++;
  if (current < questions.length) {
    renderQuestion();
  } else {
    showResult();
  }
});

function showResult() {
  progressFill.style.width = '100%';
  quizArea.style.display = 'none';
  resultArea.classList.add('show');
  finalScore.textContent = `${score} / ${questions.length}`;
  let msg = '';
  const rate = score / questions.length;
  if (rate === 1) msg = 'パーフェクト！あなたは立派なAge-Well博士です！';
  else if (rate >= 0.8) msg = 'すばらしい！Age-Well KOBEのことをよくご存知ですね。';
  else if (rate >= 0.5) msg = 'なかなかの正解率！会場を回ればもっと詳しくなれます。';
  else msg = 'ぜひ会場のブースやステージを巡って、Age-Wellな1日を楽しんでください！';
  finalMsg.textContent = msg;
  submitResult();
}

function submitResult() {
  if (!WEBAPP_URL || WEBAPP_URL.indexOf('PASTE_YOUR') === 0) return; // URL未設定なら送信しない
  fetch(WEBAPP_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // プリフライトを避けるため text/plain で送信
    body: JSON.stringify({
      name: playerName || '匿名',
      score: score,
      total: questions.length
    })
  }).catch(() => { /* 通信に失敗しても回答者側の体験は止めない */ });
}

retryBtn.addEventListener('click', () => {
  current = 0;
  score = 0;
  introArea.classList.remove('hide');
  nameInput.value = playerName;
  quizArea.style.display = 'none';
  resultArea.classList.remove('show');
});

// ── 運営者用：回答一覧 ──
adminLink.addEventListener('click', () => {
  adminModal.classList.add('show');
  adminPassword.value = '';
  adminMsg.textContent = '';
  adminResultWrap.style.display = 'none';
});

adminClose.addEventListener('click', () => {
  adminModal.classList.remove('show');
});

adminSubmit.addEventListener('click', fetchAdminResults);
adminPassword.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') fetchAdminResults();
});

function fetchAdminResults() {
  const pw = adminPassword.value.trim();
  if (!pw) {
    adminMsg.textContent = 'パスワードを入力してください';
    adminMsg.className = 'modal-msg error';
    return;
  }
  if (!WEBAPP_URL || WEBAPP_URL.indexOf('PASTE_YOUR') === 0) {
    adminMsg.textContent = '設定が完了していません（WEBAPP_URL未設定）';
    adminMsg.className = 'modal-msg error';
    return;
  }
  adminMsg.textContent = '確認中…';
  adminMsg.className = 'modal-msg';
  adminResultWrap.style.display = 'none';

  fetch(`${WEBAPP_URL}?password=${encodeURIComponent(pw)}`)
    .then((res) => res.json())
    .then((json) => {
      if (json.result !== 'ok') {
        adminMsg.textContent = json.message || 'パスワードが違います';
        adminMsg.className = 'modal-msg error';
        return;
      }
      adminMsg.textContent = '';
      const list = json.data || [];
      const avg = list.length
        ? (list.reduce((sum, r) => sum + Number(r.score), 0) / list.length).toFixed(1)
        : 0;
      adminSummary.textContent = `回答者数：${list.length}人　平均スコア：${avg}点`;
      adminTableBody.innerHTML = list.map((r) => {
        const d = new Date(r.timestamp);
        const dateStr = isNaN(d.getTime()) ? r.timestamp : d.toLocaleString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        return `<tr><td>${dateStr}</td><td>${escapeHtml(r.name)}</td><td>${r.score} / ${r.total}</td></tr>`;
      }).join('');
      adminResultWrap.style.display = 'block';
    })
    .catch(() => {
      adminMsg.textContent = '通信エラーが発生しました。時間をおいて再度お試しください。';
      adminMsg.className = 'modal-msg error';
    });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str == null ? '' : String(str);
  return div.innerHTML;
}
</script>
</body>
</html>
